name: Daily builds

on:
  workflow_dispatch

concurrency:
  group: daily-builds-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bibsnoop-librewolf
            folder: librewolf
          
          # - name: TBD
          #   folder: TBD

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build tag
        id: meta
        run: |
          echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.folder }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.meta.outputs.tag }}

################################################

  cleanup:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bibsnoop-librewolf
          # - name: TBD

    steps:
      - name: Clean up old image versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: ${{ matrix.name }}
          exclude-tags: latest
          keep-n-tagged: 3
          delete-untagged: true
          delete-orphaned-images: true
          dry-run: false
          validate: true
