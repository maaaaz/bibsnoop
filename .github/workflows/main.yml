name: Daily builds

on:
  workflow_dispatch

concurrency:
  group: daily-builds-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bibsnoop-librewolf
            folder: librewolf
          
          # - name: TBD
          #   folder: TBD

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build tag
        id: meta
        run: |
          echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.folder }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.meta.outputs.tag }}

################################################

  cleanup:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bibsnoop-librewolf
          # - name: TBD

    steps:
      - name: Clean up old image versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: ${{ matrix.name }}
          exclude-tags: latest
          keep-n-tagged: 3
          delete-untagged: true
          delete-orphaned-images: true
          dry-run: false
          validate: true

################################################
  test:
    name: test bibsnoop-librewolf (${{ matrix.name }})
    needs: [build, cleanup]
    runs-on: ubuntu-latest

    permissions:
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: librewolf_without_tor_egress
            image: bibsnoop-librewolf
            container: bibsnoop-librewolf
            tor_egress: "0"

          - name: librewolf_with_tor_egress
            image: bibsnoop-librewolf
            container: bibsnoop-librewolf-tor
            tor_egress: "1"

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start container and inspect startup
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
          CONTAINER: ${{ matrix.container }}
          TOR_EGRESS: ${{ matrix.tor_egress }}
          
        run: |
          set -Eeuo pipefail
          cleanup() {
            echo "::group::Container startup logs"
            docker logs "$CONTAINER" 2>&1 || true
            echo "::endgroup::"

            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE"

          echo "Starting container: $CONTAINER"
          if [ "$TOR_EGRESS" = "1" ]; then
            docker run -d --name "$CONTAINER" -e TOR_EGRESS=1 "$IMAGE"
          else
            docker run -d --name "$CONTAINER" "$IMAGE"
          fi
          
          echo "Waiting 40 seconds for startup..."
          sleep 40

          RUNNING=$(docker inspect --format '{{.State.Running}}' "$CONTAINER")
          if [ "$RUNNING" != "true" ]; then
            echo "::error::Container exited during startup!"
            docker inspect --format 'Exit code: {{.State.ExitCode}}' "$CONTAINER"
            exit 1
          fi
          echo "Container is still running after 40 seconds."
          echo "Quick test passed."
